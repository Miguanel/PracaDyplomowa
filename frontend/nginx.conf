server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Ochrona clickjacking (X-Frame-Options) i XSS
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Przekierowanie wszystkich żądań widoków do index.html (Obsługa React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy dla zapytań asynchronicznych do serwera FastAPI
    # Bez końcowego "/" w proxy_pass - prefiks /api/ zostaje zachowany,
    # bo endpointy FastAPI są zarejestrowane pod /api/... (np. /api/memory/malloc)
    location /api/ {
        proxy_pass http://edualgo-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}